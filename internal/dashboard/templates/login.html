<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRID0+</title>
<link rel="stylesheet" href="/assets/dashboard.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f5407e'/%3E%3Cstop offset='100%25' stop-color='%2338b6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M24 2c9 0 16 8 16 18 0 6-3 10-3 14 0 5 4 6 4 10 0 3-3 3-5 1-2-2-4-5-7-5-3 0-4 4-8 4s-5-4-8-4c-3 0-5 3-7 5-2 2-5 2-5-1 0-4 4-5 4-10 0-4-3-8-3-14C2 10 9 2 18 2c2 0 4 1 6 1s4-1 6-1z'/%3E%3Ccircle cx='17' cy='19' r='3.4' fill='%230e0e12'/%3E%3Ccircle cx='31' cy='19' r='3.4' fill='%230e0e12'/%3E%3C/svg%3E">
</head>
<body class="login-body">

<div class="ink-field" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>

<main class="login-main">
  <form class="login-card panel" method="post" action="/login">
    <svg class="brand-mark login-mark" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--ink-a)"/>
          <stop offset="100%" stop-color="var(--ink-c)"/>
        </linearGradient>
      </defs>
      <path fill="url(#brandGrad)" d="M24 2c9 0 16 8 16 18 0 6-3 10-3 14 0 5 4 6 4 10 0 3-3 3-5 1-2-2-4-5-7-5-3 0-4 4-8 4s-5-4-8-4c-3 0-5 3-7 5-2 2-5 2-5-1 0-4 4-5 4-10 0-4-3-8-3-14C2 10 9 2 18 2c2 0 4 1 6 1s4-1 6-1z"/>
      <circle class="brand-eye" cx="17" cy="19" r="3.4"/>
      <circle class="brand-eye" cx="31" cy="19" r="3.4"/>
    </svg>
    <h1>GRID0+</h1>
    <p class="sub">Enter the dashboard token to continue.</p>
    {{ if .Failed }}<p class="login-error" role="alert">That token was not accepted.</p>{{ end }}
    <label class="login-field">
      <span>Token</span>
      <input type="password" name="token" autocomplete="current-password" autofocus required>
    </label>
    <button type="submit" class="btn btn-primary login-submit">Log in</button>
    <p class="login-note">This is the shared <code>dashboard.token</code> from GRID0+'s config, not a
      personal account. Once accepted, this browser
      stays signed in for 30 days.</p>
  </form>
</main>

</body>
</html>
