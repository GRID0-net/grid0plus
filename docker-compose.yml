# GRID0+'s off-the-shelf infrastructure: Postgres, Redis, and the nginx
# TLS edge. Nothing here is built from this repo's own code -- Docker was
# never the slow part for these three -- so they stay containerized.
#
# The eight Go services (dauth, aauth, baas, stubs, natcheck, npln, dashboard,
# toolbox) do NOT run here. They run as native processes: 'make run' for
# interactive use, or as systemd units (deploy/systemd/, installed with
# scripts/install-systemd.sh) for the always-on box serving your consoles --
# systemd units are also where the "restart baas without dropping a
# console's dauth request" per-service isolation this file used to provide
# now lives.
#
#   make up          start Postgres, Redis and nginx
#   make down         stop them, keeping the volumes
#   make logs         follow their logs
#   make clean-data   stop everything and DELETE the database
#
# For the Go services: 'make run' (foreground, dev), or
# scripts/install-systemd.sh + 'sudo systemctl start switchnet.target'
# (production). See CLAUDE.md and docs/DEPLOYMENT.md.

name: switchnet

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: switchnet
      POSTGRES_PASSWORD: switchnet
      POSTGRES_DB: switchnet
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      # Exposed for psql and for the tests. Remove this line in a deployment
      # that is reachable from anywhere but the operator's own machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchnet -d switchnet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No persistence: presence events are worthless the moment they are late,
    # and a subscriber that reconnects reads current state from Postgres.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # nginx: TLS edge; routes Nintendo hostnames to the right backend by SNI
  # ---------------------------------------------------------------------------
  # Runs with host networking so the upstream addresses in the generated config
  # (127.0.0.1:808x, plus 7575 for gamesync and 8443 for the toolbox API)
  # resolve directly to where the Go services listen, whether they are
  # running natively or (during a rolling restart) briefly not.
  # NET_BIND_SERVICE is needed to bind port 443 (and 7575, and 8443) without
  # running as root.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./deploy/nginx.params.conf:/etc/nginx/conf.d/00_params.conf:ro
      - ./deploy/nginx.generated.conf:/etc/nginx/conf.d/switchnet.conf:ro
      - ./deploy/nginx.toolbox.conf:/etc/nginx/conf.d/switchnet-toolbox.conf:ro
      - ./certs/edge.crt:/etc/switchnet/certs/edge.crt:ro
      - ./certs/edge.key:/etc/switchnet/certs/edge.key:ro

volumes:
  postgres:
  redis:
