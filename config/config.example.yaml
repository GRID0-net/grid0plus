# GRID0+ configuration
#
# Copy this to config/config.yaml and edit it. Every value can also be set from
# the environment as SWITCHNET_<SECTION>_<KEY> -- useful for a one-off override
# without editing the file; the environment always wins over this file.
#
# Validate a config without starting anything:
#
#   switchnetctl -config config/config.yaml check
#
# Nothing here is a secret except keys.device_id_secret. config/config.yaml is
# gitignored, so it is safe to put the real value in it.

# ---------------------------------------------------------------------------
# network: where your servers are, from a console's point of view
# ---------------------------------------------------------------------------
network:
  # The address the consoles are pointed at. This goes into the generated
  # hosts file and into the NAT-check replies. It must be an IP address that
  # the consoles can reach, not a hostname and not 127.0.0.1.
  public_ip: "192.168.1.50"

  # A SECOND address, different from public_ip, that answers the nncs2
  # NAT-check host.
  #
  # This is not optional if you want peer-to-peer play to work. Pia sends its
  # second NAT probe only when nncs1 and nncs2 resolve to different addresses;
  # if they are the same it de-duplicates the probe, never completes NAT
  # detection, and matchmaking finds opponents that the console then cannot
  # connect to. On the deployment this was checked against, that failure
  # appeared as Mario Kart 8 error 2618-201 and looked nothing like a NAT
  # problem.
  #
  # A second address on the same machine is enough. Leave it empty only if you
  # genuinely have one address, and accept that consoles will report a stricter
  # NAT type than they really have.
  natcheck_secondary_ip: "192.168.1.51"

  # The port the nginx TLS edge listens on. The console always connects to 443,
  # so change this only if something in front of nginx maps the port.
  edge_tls_port: 443

# ---------------------------------------------------------------------------
# dns: how a console finds GRID0+
# ---------------------------------------------------------------------------
# GRID0+ does not run its own DNS server. Redirect a console with a
# resolver you already have (a router running dnsmasq, Pi-hole, Unbound): run
# 'make gen-dns' and add the generated configuration there. Either the router
# hands that resolver out over DHCP -- in which case the console needs no
# configuration at all -- or set the console's DNS manually under System
# Settings -> Internet. Nothing goes on the SD card either way.
dns:
  # TTL of the answers GRID0+ synthesises, in seconds. Short on purpose:
  # switching a console back to Nintendo should take effect in a minute, not
  # after an hour of cached records.
  ttl: 60

# ---------------------------------------------------------------------------
# database
# ---------------------------------------------------------------------------
database:
  url: "postgres://switchnet:switchnet@localhost:5432/switchnet?sslmode=disable"
  max_conns: 10
  # Apply pending migrations on startup. The migration files are also
  # golang-migrate compatible, so you can run them with the migrate CLI instead.
  auto_migrate: true

# ---------------------------------------------------------------------------
# redis: the presence bus
# ---------------------------------------------------------------------------
redis:
  # Leave empty while only the BAAS server publishes presence: it then uses an
  # in-process bus. Set it before running a second process that needs presence
  # events — the phase 2 dashboard, the NPLN server, or a second BAAS replica —
  # because an in-process bus silently delivers nothing across a process
  # boundary.
  url: ""
  channel: "switchnet:presence"

# ---------------------------------------------------------------------------
# keys: token signing
# ---------------------------------------------------------------------------
keys:
  # Four RSA keys live here, one per token issuer. Every service that verifies a
  # token needs the same directory: aauth verifies dauth's device tokens, and
  # baas verifies both. Pointing them at different directories does not error —
  # it rejects every request with a confusing "token expired".
  dir: "certs/keys"

  # Create a key if one is missing. Convenient for a first run. Turn it off once
  # certs/keys is backed up, so a lost volume fails loudly instead of silently
  # invalidating every token the consoles are holding.
  generate_if_missing: true

  # Salts the derivation of device ids and the 'edi' claim. Any long random
  # string; it only has to stay the same. Generate one with:
  #   openssl rand -hex 32
  device_id_secret: "CHANGE-ME-openssl-rand-hex-32"

# ---------------------------------------------------------------------------
# dauth: device authentication
# ---------------------------------------------------------------------------
dauth:
  # Loopback only: nothing outside this machine calls dauth directly -- nginx
  # is the only thing that reaches it, over the edge TLS listener. Bind-all
  # would put it on the LAN unauthenticated with no reason to.
  listen: "127.0.0.1:8081"
  # Keep Nintendo's values. The console does not check them, but tooling and
  # packet-capture diffs compare against them.
  issuer: "dauth-lp1.ndas.srv.nintendo.net"
  jwks_url: "https://dcert-lp1.ndas.srv.nintendo.net/keys"
  token_ttl: 86400
  challenge_ttl: 60
  # The header nginx puts the console's TLS client certificate fingerprint in.
  # With it, each console gets its own device id. Without it they all share one,
  # which is harmless — accounts are keyed on the BAAS device account, never on
  # this — but it makes the dashboard's device list useless.
  client_cert_header: "X-SwitchNet-Client-Cert"
  # The header nginx puts the console's full TLS client certificate in
  # ($ssl_client_escaped_cert), used only to compute the 'x5t#S256' claim on
  # issued tokens — a real SHA-256 thumbprint of already-untrusted, already-
  # passed-through cert bytes, not verification of them. Leave empty to omit
  # the claim instead of guessing at it. See internal/jwt/issue.go's
  # DeviceInfo.X5tS256.
  client_cert_pem_header: "X-SwitchNet-Client-Cert-PEM"

# ---------------------------------------------------------------------------
# aauth: application authentication
# ---------------------------------------------------------------------------
aauth:
  # Loopback only, same reasoning as dauth.listen above.
  listen: "127.0.0.1:8082"
  issuer: "aauth-lp1.ndas.srv.nintendo.net"
  jwks_url: "https://acert-lp1.ndas.srv.nintendo.net/keys"
  token_ttl: 86400

  # FREE or MEMBERSHIP_REQUIRED. FREE is the right default for a private
  # network: the console never asks for a Nintendo Switch Online membership.
  online_play_policy: "FREE"
  # SYSTEM or GAME_SERVER. Only sent when the policy is MEMBERSHIP_REQUIRED.
  policy_handler: "GAME_SERVER"

  # Per-title overrides, keyed by the 16-hex-digit title id. Use these if a game
  # behaves differently when the policy does not match what it saw on retail
  # servers. Splatoon 3 on retail is MEMBERSHIP_REQUIRED with a GAME_SERVER
  # handler, which is what makes the id token carry the 'hm' claim.
  title_overrides: {}
  #  "0100c2500fc20000":          # Splatoon 3
  #    online_play_policy: "MEMBERSHIP_REQUIRED"
  #    policy_handler: "GAME_SERVER"

# ---------------------------------------------------------------------------
# baas: accounts and friends
# ---------------------------------------------------------------------------
baas:
  listen: ":8083"
  # Keep Nintendo's values: game servers verify id tokens against the issuer,
  # and the JWKS URLs have to be hosts in the redirect list.
  issuer: "https://e0d67c509fb203858ebcb2fe3f88c2aa.baas.nintendo.com"
  audience: "ed9e2f05d286f7b8"
  access_token_jwks_url: "https://e0d67c509fb203858ebcb2fe3f88c2aa.baas.nintendo.com/1.0.0/internal_certificates"
  id_token_jwks_url: "https://e0d67c509fb203858ebcb2fe3f88c2aa.baas.nintendo.com/1.0.0/certificates"

  access_token_ttl: 10800
  id_token_ttl: 10800

  # How long a user must wait before regenerating their friend code. Nintendo
  # uses 24 hours. Shortening it lets somebody invalidate a code they just gave
  # out before it can be typed in.
  friend_code_cooldown: 86400

  # How long a reported presence stays valid without a refresh. The console
  # reports PLAYING when a game starts and does not report again, so without
  # this a console switched off mid-game shows as playing forever.
  presence_ttl: 300

  # How long a console counts as ONLINE after its last authenticated request.
  #
  # This is what stops a console idling in the Home Menu from reading as offline
  # to all its friends. It reports no state there, but it keeps polling its
  # friend list, and that traffic is proof of life. Set it to less than the
  # console's polling interval and friends will blink offline between polls.
  console_presence_ttl: 300

  image_dir: "data/images"
  # Where uploaded profile pictures are served from. It has to be a host in the
  # redirect list, or the console cannot fetch them. No path suffix: a
  # 2026-09-19 capture shows the console requests images at the root of this
  # host, as '/1/<etag>' and '/2/<etag>' -- see internal/baas/images.go's
  # imageURLs doc comment. Do not add '/images' back onto this.
  image_base_url: "https://cdn-image-e0d67c509fb203858ebcb2fe3f88c2aa.baas.nintendo.com"
  max_image_bytes: 1048576

  # Whether an unknown console may create an account. Turn this off once every
  # console in the group is registered, so somebody who finds the server cannot
  # add themselves to it.
  allow_registration: true

  # The Discord bot's account API (n-popescu/grid0plus-discord): the only way
  # to create a person's account, plus friends, avatars, who is online and
  # service status. Loopback only; the bot runs on this host. Empty listen
  # turns it off. The token is a shared secret the bot also holds:
  # openssl rand -hex 32. Registration through it honours allow_registration.
  bot_api:
    listen: ""   # e.g. "127.0.0.1:8096"
    token: ""

  # How many login attempts (POST /1.0.0/login and federation) one client
  # address gets per login_window_seconds, before further attempts from it are
  # refused until the window rolls forward. 0 disables the limit. A device
  # account's password is generated and never user-chosen, so unbounded
  # guessing is a smaller risk here than for a password a person picked -- but
  # smaller is not zero, and there was previously no limit at all.
  login_attempts_per_window: 20
  login_window_seconds: 300

  # Log request and response bodies on the access log line. Useful exactly
  # once, to see the real bytes a console sent or received without a
  # console-side capture. Carries real tokens and device account passwords
  # in plain text in the log -- far too sensitive and chatty to leave on.
  log_bodies: false

# ---------------------------------------------------------------------------
# scsi: OLSC cloud save backup (phase 4)
# ---------------------------------------------------------------------------
scsi:
  # Loopback only, same reasoning as dauth.listen above.
  listen: "127.0.0.1:8091"

  # This service's own externally-reachable base URL. Must be a host in the
  # redirect list (storage.hac.lp1.scsi.srv.nintendo.net) -- see internal/scsi's
  # signedURI doc comment for why it is used at all.
  public_url: "https://storage.hac.lp1.scsi.srv.nintendo.net"

  # Where save data blobs are written, on this same box. See
  # docs/ROADMAP.md's phase 4 section for why local disk is the default
  # storage backend rather than object storage: no new recurring cost, and
  # the operator already pays for this machine regardless.
  storage_dir: "data/save-archives"

  # Caps one BAAS user's total stored save data across every title. 0 means
  # unlimited -- do not leave this at 0 in a real deployment: nothing else
  # stops one console from filling the disk and taking the rest of GRID0+
  # down with it. 1 GiB is generous for save data (real Switch saves are
  # almost always well under 100 MiB).
  per_user_quota_bytes: 1073741824

# ---------------------------------------------------------------------------
# stubs: endpoints answered but not implemented
# ---------------------------------------------------------------------------
stubs:
  # Loopback only, same reasoning as dauth.listen above.
  listen: "127.0.0.1:8084"
  # Log request bodies. Useful exactly once, while working out what an
  # unimplemented endpoint is being asked for. Far too chatty to leave on.
  log_bodies: false

  # Record every request to the bcat-* hosts, hexdumped, into this directory.
  #
  # The hosts are answered 304 ("your cache is current") either way; this only
  # adds a transcript of what the console asked for -- the list and data paths
  # native BCAT serving would have to answer (TODO.md 2.4, stage 1). Safe to
  # leave on; empty records nothing.
  bcat_record_dir: ""

# ---------------------------------------------------------------------------
# bcat -- Splatfest content packs (phase 2)
# ---------------------------------------------------------------------------
bcat:
  # A command that turns a source asset into a game format.
  #
  # SWITCHNET DOES NOT CONVERT TEXTURES ITSELF, deliberately. A BFRES texture in
  # the wrong compression or the wrong Tegra swizzle LOADS and renders as
  # garbage -- on a console, with nothing on the server to look at. Switch
  # Toolbox and the BinaryTextureLibrary family already do it correctly, and they
  # exist because it is hard.
  #
  # The command is called as:
  #
  #     <command> <source> <destination> <kind> <target-extension>
  #
  # It must write <destination> and exit zero. A non-zero exit, a missing file or
  # an empty one all stop the build with the command line that produced them.
  #
  # A source asset is named for what it must BECOME, with the source extension
  # appended: UI/Splashart.bfres.png becomes UI/Splashart.bfres. So the target
  # format is visible in a directory listing and nothing has to guess it.
  #
  # Empty means no converter -- and then a source asset is a BUILD ERROR rather
  # than a file packed as-is. That refusal is the point: packing a PNG gives a
  # fest that loads on the console with art the game cannot decode.
  converter: ""

  # Seconds one conversion may take. A converter that hangs would otherwise hang
  # the build, and on the dashboard a request that never answers.
  converter_timeout: 120

  # Where `switchnetctl fest build -out` writes its seed folders, and where the
  # dashboard serves them from for the console-side installer
  # (switch/bcat-installer/). Empty means those endpoints answer 404.
  seed_dir: ""

  # Rewrite {FEST} in an asset's in-pack path to the fest's own id.
  #
  # A real custom pack had every internal file named for the fest it was DERIVED
  # from while announcing a different one, and nobody has established what the
  # game keys on. On is the consistent choice; off keeps whatever names the
  # source files carry. See docs/QUESTIONS.md.
  substitute_fest_id: true

# ---------------------------------------------------------------------------
# dashboard -- the operator's web view (phase 2)
# ---------------------------------------------------------------------------
dashboard:
  listen: ":8087"

  # Where to reach npln's matchmaking controls, and the token for them. Both
  # must match npln.admin_listen and npln.admin_token above. Leave either empty
  # and the matchmaking panel says it is not configured -- deliberately, rather
  # than showing an empty queue that reads as "nobody is playing".
  npln_admin_url: "127.0.0.1:8089"
  npln_admin_token: ""

  # The same for the Splatoon 2 panel: must match nex.admin_listen and
  # nex.admin_token below. Leave either empty and the panel says so.
  nex_admin_url: "127.0.0.1:8093"
  nex_admin_token: ""

  # A shared secret required on every request. Empty means NO authentication:
  # anyone who can reach this port can schedule and cancel Splatfests.
  #
  # Nothing in phase 1 authenticates a person -- every credential in the stack
  # belongs to a console -- so there is no user account to check against yet.
  token: ""

  # NOTE: the dashboard is a separate process from baas, so it needs redis.url
  # set to see live presence. The in-process bus does not cross a process
  # boundary, and it fails silently: the page simply never updates.

# ---------------------------------------------------------------------------
# npln -- the Splatoon 3 game server (phase 2)
# ---------------------------------------------------------------------------
npln:
  # THREE listeners, and they are not interchangeable.
  #
  # Splatoon 3 does not open with gRPC. It first talks ordinary JSON over HTTPS
  # to the vermillion and penne hosts, and only then opens a gRPC channel to
  # the tenant host. nginx must send each to the right place: grpc_pass for
  # `listen`, proxy_pass for `rest_listen`. Crossing them completes the TLS
  # handshake and then fails with nothing in either log -- the game reports a
  # generic communication error and the server never sees a request.
  #
  # All three loopback only: nginx is the only thing that reaches them directly.
  listen: "127.0.0.1:8085"
  rest_listen: "127.0.0.1:8086"

  # gamesync is the document/watch service, and this is where it listens
  # INTERNALLY -- deliberately not 7575.
  #
  # The console reaches gamesync on 7575, and that port belongs to the nginx
  # edge: it terminates TLS there and grpc_passes to this address. Binding the
  # backend to 7575 too means nginx cannot start, and two listeners racing for
  # the port is a much worse first symptom than a port that reads oddly here.
  gamesync_listen: "127.0.0.1:8088"

  # The NPLN tenant id, in the full form a real Nintendo token carries in its
  # tid (and the one the console is recorded sending as npln-tenant-id):
  # Splatoon 3's is t-dce9377b-lp1 -- also the first label of its tenant host,
  # t-dce9377b-lp1.lp1.t.npln.srv.nintendo.net. It names this tenant's
  # resources and goes into every token. The short form "dce9377b" is still
  # accepted from the console.
  tenant: "t-dce9377b-lp1"

  # The title id an access token's npln.app_id claim carries. Splatoon 3's is
  # 0100c2500fc20000 -- a public, documented constant, not a guessed value.
  app_id: "0100c2500fc20000"

  # NPLN access tokens are ES256 -- the only ES256 tokens in the stack. See
  # internal/jwt's README for why that path is deliberately separate from the
  # RS256 one.
  issuer: "https://t-dce9377b-lp1.lp1.t.npln.srv.nintendo.net"
  jwks_url: "https://t-dce9377b-lp1.lp1.t.npln.srv.nintendo.net/1.0.0/certificates"
  # 28800 (8h) is confirmed by a 2026-09-23 decrypted capture of a real
  # working server's access token, not guessed.
  access_token_ttl: 28800

  # The most players a match takes.
  #
  # Eight, the real 4v4. For Turf War/Anarchy-shaped modes this is a cap, not
  # a target: a full lobby starts immediately, and below it a match with an
  # even number of players (two equal teams) starts once versus_grace_period
  # passes with nobody arriving or leaving -- so two, four or six friends
  # still get to play.
  players_per_match: 8

  # Per-mode overrides of the above.
  #
  # Keyed on the mode name the game sends in a ticket's matchmaking_config.
  # Any mode that arrives without an entry is logged once. Turf War and
  # Anarchy are 4v4 (eight players, the default above), Salmon Run is four,
  # Tricolour is 4v2v2.
  mode_players:
    "tenants/current/matchmakingConfigs/coop_regular_config": 4
    "tenants/current/matchmakingConfigs/coop_bigrun_config": 4
    "tenants/current/matchmakingConfigs/coop_team_contest_config": 4

  # Modes formed like Salmon Run -- one team, no even split -- rather than
  # like Turf War/Anarchy. Give each one its size in mode_players too;
  # otherwise it takes up to players_per_match. These are the three Salmon
  # Run configs in Splatoon 3's own table: regular, Big Run, and Eggstra
  # Work (coop_team_contest_config). coop_regular_config is seen on hardware;
  # the other two come from the game binary.
  coop_modes:
    - "tenants/current/matchmakingConfigs/coop_regular_config"
    - "tenants/current/matchmakingConfigs/coop_bigrun_config"
    - "tenants/current/matchmakingConfigs/coop_team_contest_config"

  # How long, in seconds, a versus-shaped match below players_per_match waits
  # with an even number of players before starting anyway. Anyone arriving or
  # leaving restarts the countdown; an odd count stops it until one more
  # player joins, so the teams are always equal. A full lobby never waits.
  # Zero turns early starts off: matches then start only when full.
  versus_grace_period: 20

  # How long a Salmon Run-shaped match waits after its SECOND player joins
  # before forming, restarting on every further arrival up to the mode's size
  # (which forms immediately -- a full room has nobody left to wait for). A
  # lone player is never on this clock: matchmaking waits for a second player
  # however long that takes, same as always. Zero forms the instant two
  # players are present.
  coop_grace_period: 30

  # Experimental: advertise seven measured latency regions, all mapped to
  # the first reachable STUN endpoint (or network.public_ip:3478). Leave
  # disabled unless investigating this compatibility path.
  regional_latency_servers: false

  # How long a matchmaking ticket waits before giving up, in seconds. A ticket
  # that never resolves leaves the player on a spinner with no way back, so
  # timing out is what lets the game offer to try again.
  ticket_ttl: 180

  # STUN and TURN servers for NAT traversal.
  #
  # Splatoon 3 uses ICE, not the Pia NAT-check pair, so the natcheck section
  # below is not involved in this title at all.
  #
  # THE ADDRESSES MUST BE REACHABLE FROM THE CONSOLE, not merely from this
  # server. Wrong ones produce "the lobby fills but the match never starts",
  # which from the server side is indistinguishable from a matchmaking bug.
  #
  # Empty is fine for consoles on one LAN: they reach each other directly.
  # `switchnetctl check` warns so that the choice is a deliberate one.
  ice_servers: []
  # Optional coturn REST shared secret. Keep the real value only in the
  # untracked config.yaml (or SWITCHNET_NPLN_TURN_AUTH_SECRET); never commit it.
  # With this set, turn entries below omit username/password: GRID0+ issues
  # a distinct expiring credential to each authenticated player.
  turn_auth_secret: ""
  #  - kind: stun          # stun or turn
  #    host: "192.168.1.50"
  #    port: 3478
  #    protocol: udp       # udp, tcp or tls
  #  - kind: turn
  #    host: "192.168.1.50"
  #    port: 3478
  #    protocol: udp
  #    username: "switchnet"
  #    password: "change-me"

  # The fro-N host the console is told to open its persistent connection to.
  #
  # fro-N is a family and the server picks a member. It MUST be one the host
  # list redirects -- naming one it does not sends that connection to real
  # Nintendo, where it succeeds, and the game then misbehaves in a way that
  # looks like GRID0+'s fault. The server refuses to start rather than allow
  # it, so a typo here is caught immediately.
  frontline_host: "fro-3.hac.lp1.penne.srv.nintendo.net"

  # Where a match tells each console to open its gamesync session
  # (GameSession.host and .port). The tenant host on 443: nginx sends the
  # Gamesync service path there to gamesync. A 2026-09-27 working Ryujinx
  # capture instead uses a literal IP on :7575. Both edge routes exist; use
  # the endpoint your clients actually reach. Hostnames must be redirected.
  session_host: "t-dce9377b-lp1.lp1.t.npln.srv.nintendo.net"
  session_port: 443

  # Optional reference-timing probe: minimum age of TrackMatchmakingTicket
  # before sending SUCCEEDED. Zero leaves normal matchmaking timing unchanged.
  track_minimum_seconds: 0

  # Record every JSON front-end request and response to this directory.
  #
  # The vermillion, penne and frontline shapes are undocumented, and this is how
  # they get settled: point it somewhere, put a console through one boot, and the
  # transcript is on disk -- hexdumped, in order, with credentials redacted.
  # Then write it up under docs/CAPTURES/ and reconcile internal/nplnrest.
  #
  # Off by default: it writes whatever the console sends.
  rest_record_dir: ""

  # The stage and mode rotation the lobby shows.
  #
  # THE NUMBERS ARE SPLATOON 3'S OWN. Stage ids ARE public and documented --
  # internal/toyohr.VsStages (all 25 listed stages, sourced from
  # github.com/Leanny/splat3's own VersusSceneInfo.json, the same public data
  # dump this project's Salmon Run stage table already uses) -- see that
  # file's own doc comment for the sourcing. The commented-out example below
  # uses eight of those real ids as a starting point, not a guess. Rule ids
  # are 1-4 on the wire (both working hall captures use exactly that range
  # for Bankara, X and League); which number is which mode is not yet pinned
  # down, so check the in-game schedule screen after setting bankara_rules.
  # What GRID0+ supplies either way is everything around
  # the numbers: two-hour slot alignment, the rotation order, the window a
  # client asked for, and the etag its conditional request compares.
  #
  # Empty is fine. The schedule handlers then answer with no schedules, which is
  # what the game sees between seasons on a real server, and the absence is
  # logged once so you can tell it from a broken server.
  #
  # Written as strings on purpose: stage 0 is a plausible id, so a typo has to
  # be an error rather than quietly becoming zero.
  rotation:
    regular_stages: []
    bankara_rules: []
    bankara_stages: []
    # How many stages one slot offers. Zero means two, which is what a real
    # rotation offers.
    stages_per_slot: 0
    # Eight real stage ids (internal/toyohr.VsStages) as a starting point --
    # Scorch Gorge, Eeltail Alley, Hagglefish Market, Undertow Spillway,
    # Um'ami Ruins, Mincemeat Metalworks, Brinewater Springs, Barnacle & Dime:
    # regular_stages: ["1", "2", "3", "4", "5", "6", "7", "8"]
    # bankara_stages: ["9", "10", "11", "12", "13", "14", "15", "16"]
    # bankara_rules: 1-4, mapping to modes unconfirmed -- see above:
    # bankara_rules: ["1", "2"]

  # The matchmaking controls the dashboard drives: the live queue, force-start,
  # per-mode player counts, cancelling a ticket.
  #
  # The queue lives in THIS process and the dashboard is a different one, so it
  # needs a way across. NOT one of the Nintendo hostnames and never reached by a
  # console -- bind it to loopback or a private interface.
  #
  # Served ONLY when admin_token is set. These controls start matches and change
  # how many players one takes, so there is no version of them that is safe to
  # hand to whoever can reach the port. Must match dashboard.npln_admin_token.
  admin_listen: "127.0.0.1:8089"
  admin_token: ""

# ---------------------------------------------------------------------------
# nex -- NEX game servers: Splatoon 2
# ---------------------------------------------------------------------------
nex:
  # NEX is the stack before NPLN. A Switch reaches a NEX title as a WebSocket
  # on g<game server id>-lp1.s.n.srv.nintendo.net:443; nginx terminates TLS
  # there and proxies here. One listener serves every title (nginx's Host
  # header picks which). Loopback: only nginx reaches it.
  listen: "127.0.0.1:8092"

  # Seconds of silence before a console is dropped. A console that went away
  # without closing is otherwise still "in" its lobby, and a lobby holding a
  # player who is not there never starts.
  idle_timeout: 60

  # The operator API the dashboard's Splatoon 2 panel uses: connected
  # players, lobbies, recent calls, the relay, and the controls to disconnect
  # a player or place an Annie order for one. Served ONLY when admin_token is
  # set; never reached by a console. Must match dashboard.nex_admin_token.
  admin_listen: "127.0.0.1:8093"
  admin_token: ""

  splatoon2:
    enabled: true
    # Where the secure half of the game server lives. Empty keeps it on the
    # same WebSocket as the login half -- the console is told "0.0.0.1",
    # which a Switch reads as "where you already are". Set both only if a
    # console turns out not to honour that; see internal/splatoon2/README.md.
    secure_address: ""
    secure_port: 0

  # The relay, for two consoles that cannot punch through to each other: the
  # server stands in as each one's public address and forwards between them,
  # one UDP port per pair. Off by default -- it carries match traffic through
  # your connection -- and even on, it relays only who you list. Forward the
  # whole port range (UDP) from your router to this machine.
  relay:
    enabled: false
    advertise_ip: ""       # empty: network.public_ip
    listen_ip: ""          # empty: every interface
    port_base: 30100
    port_span: 900
    # User ids (the dashboard shows them). "!<id>" relays that player straight
    # away instead of waiting for their direct connection to fail.
    allow: []
    # Relay anyone whose NAT is strict or whose punches all fail. Leave off
    # until the relay is proven for one player.
    allow_all: false

# ---------------------------------------------------------------------------
# toolbox: the public API for the GRID0+ Toolbox homebrew app
# ---------------------------------------------------------------------------
toolbox:
  # Loopback only, same reasoning as dauth.listen: nginx is the only thing
  # that reaches this directly, over its own dedicated port (see
  # deploy/nginx.toolbox.conf) rather than a slot in the Nintendo-hostname
  # SNI map -- this answers a homebrew app, not a Nintendo endpoint.
  listen: "127.0.0.1:8090"

  # Identify the private repository /updates/* reads Toolbox releases from
  # (net-GRID0/cfw-GRID0plus, whose releases carry grid0plus-toolbox.nro). Leave this and the other three toolbox.* keys below empty to serve
  # /status only, with /updates/* answering 503 instead of 502ing on every
  # request.
  github_owner: "net-GRID0"
  github_repo: "cfw-GRID0plus"

  # A fine-grained personal access token (github.com/settings/personal-access-tokens),
  # scoped to ONLY github_owner/github_repo, permission Contents: Read-only,
  # nothing else. Never a classic token -- those cannot be scoped to one
  # repository, and this one exists specifically so the scope stays that
  # narrow.
  #
  # This is the one credential in all of GRID0+ that exists so a *client*
  # binary never has to hold one: the console asks this service, never
  # GitHub directly, and the token never leaves this box.
  github_token: "CHANGE-ME-a-fine-grained-PAT-scoped-to-cfw-GRID0plus-contents-read-only"

  # This service's own address as a console reaches it: the same public IP
  # as network.public_ip, fixed port 8443 (deploy/nginx.toolbox.conf),
  # always https -- that nginx block has no plain-http listener. Used to
  # build /updates/latest's browser_download_url. Not inferred from the
  # incoming request on purpose: nginx terminates TLS and proxies to this
  # service over plain HTTP, so the request this service actually sees
  # never carries the real scheme, and nginx's Host forwarding drops the
  # port too -- see internal/toolbox's package comment. No path; leave that
  # to handleUpdatesLatest. Required, with the three keys above, for
  # /updates/* to answer anything but 503.
  public_base_url: "https://203.0.113.5:8443"

  # How long releases/latest is cached before calling GitHub again. Several
  # consoles checking within this window cost one GitHub request, not one
  # per console.
  release_cache_ttl_seconds: 120

# ---------------------------------------------------------------------------
# natcheck: the UDP NAT-check responder
# ---------------------------------------------------------------------------
natcheck:
  # Nintendo's ports. The console connects to these numbers, so do not change
  # them unless something is forwarding.
  primary_listen: ":10025"
  secondary_listen: ":10125"

  # A socket on the SECOND address, used for NAT-check message type 2 which must
  # be answered from a different address. Set this to
  # <natcheck_secondary_ip>:10025. Leaving it empty answers type 2 from the
  # secondary port instead, which lets detection finish but reports a stricter
  # NAT than the router really has.
  alternate_listen: "192.168.1.51:10025"

  # Answer type 102 from the port it was sent to (10025), as a working
  # Nextendo server does. False answers from 10125 instead, which a
  # port-restricted home router drops.
  type102_same_port: true

  # Answers STUN (RFC 5389) Binding requests -- a different protocol from NCS
  # above, but the same kind of lightweight UDP connectivity responder.
  # Splatoon 3 sends these to whatever host
  # npln.ListLatencyMeasurementServers names, and this port (3478) is what
  # that response advertises. Empty disables it.
  stun_listen: ":3478"

# ---------------------------------------------------------------------------
# logging
# ---------------------------------------------------------------------------
log:
  # debug, info, warn or error. 'debug' logs every NAT-check datagram, which is
  # a lot; it is the right setting while bringing a console up.
  level: "info"
  # text or json
  format: "text"
