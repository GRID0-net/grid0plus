# GRID0+ nginx parameters — placed before switchnet.conf alphabetically.
# The generated config carries many long server_name values; the default
# bucket size of 64 is too small.
server_names_hash_bucket_size 128;

# OpenSSL 3.5's default TLS 1.3 group list includes X25519MLKEM768 (post-quantum
# hybrid) and offers it whenever a client does. The console's system-browser TLS
# client advertises it but cannot actually complete that key exchange: captured
# 2026-08-25, the ClientHello negotiates X25519MLKEM768, nginx sends a 1120-byte
# key share, and the console goes silent and closes the connection ~600ms later
# without ever sending a Finished message — the "loads forever, then gives up"
# symptom on the Nintendo Account link page. Nothing here needs post-quantum key
# exchange, so restrict to the classical groups every other console TLS client
# (dauth, aauth, baas) already negotiates successfully.
ssl_conf_command Groups X25519:P-256:P-384:P-521;
