# GRID0+ Toolbox's public API — hand-maintained, unlike nginx.generated.conf.
#
# This does NOT belong in internal/nintendo/hosts.go's redirect table:
# that table is "the single source of truth for the [Nintendo] domain
# list" (see its package comment) and drives the DNS-MITM hosts file, the
# SNI routing map and the certificate SANs for hostnames a CONSOLE'S SYSTEM
# resolves. The GRID0+ Toolbox homebrew app is not a Nintendo endpoint
# and does not need DNS redirection at all: it already knows the server's
# IP (the same address/override the app's hosts screen writes), and just
# needs nginx to route ITS OWN connection to the right backend.
#
# So this gets its own fixed port instead of a slot in the SNI map on 443 —
# the same reason gamesync gets its own port (7575) rather than a name in
# that map: a second server block on one port for a different protocol/
# audience is a routing mistake waiting to happen, not a routing decision.
#
# The console's own HTTPS client (source/net.c in switchnet-nro) already
# skips certificate verification unconditionally for its own connections
# (GRID0+'s certs are signed by a private, self-issued CA the console
# only trusts via the disable_ca_verification/disable_browser_ca_verification
# ExeFS/NRO patches, which cover the SYSTEM SSL service and the browser
# applet — not this app's own TLS stack), so reusing the edge certificate
# here is fine: nothing on the console actually checks it.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/switchnet/certs/edge.crt;
    ssl_certificate_key /etc/switchnet/certs/edge.key;

    # No client certificate here: this is not a device-auth endpoint, and
    # nothing about the toolbox app carries one.

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /updates/download streams a ~350 KiB .nro; buffering it whole
        # before forwarding would just add latency for no benefit at this
        # size, and there's no reason to raise proxy_max_temp_file_size for
        # a file this small either.
        proxy_buffering off;
    }
}
