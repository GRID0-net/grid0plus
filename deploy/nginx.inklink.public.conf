# Public browser endpoint for the player companion. Keep this separate from
# nginx.generated.conf: that file routes Nintendo SNI names on 443.
server {
    listen 80;
    listen [::]:80;
    server_name 89.168.58.206;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name 89.168.58.206;

    ssl_certificate /etc/letsencrypt/live/89.168.58.206/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89.168.58.206/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # OAuth callback URLs carry a one-time authorization code. Do not put it
    # in nginx access logs; INKLINK consumes it server-side and never logs it.
    access_log off;
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The operator dashboard, over TLS. The dashboard itself listens on loopback
# only; this block is the one public way in. It binds the host's public-facing
# private address rather than every address so the loopback listener can keep
# the same port number. The token can arrive as ?token=, so no access log.
server {
    listen 10.0.0.126:8087 ssl;
    server_name 89.168.58.206;

    ssl_certificate /etc/letsencrypt/live/89.168.58.206/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89.168.58.206/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log off;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The live event stream and the seed downloads are long responses.
        proxy_buffering off;
        proxy_read_timeout 1h;
        # The dashboard cannot see TLS behind this proxy, so it would not mark
        # its login cookie Secure by itself.
        proxy_cookie_flags ~ secure;
    }
}
